name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Format, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix functions
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix functions
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix functions # tsc
      - run: npm test --prefix functions
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend # vue-tsc + vite build

  e2e:
    name: End-to-end against emulators (mock LLM + mock HighLevel)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions && npm run build --prefix functions
      # Emulator-only config: mocks on, dummy secrets. No real keys ever reach CI.
      - name: Emulator config
        run: |
          cat > functions/.env.local <<'ENV'
          MOCK_LLM=true
          MOCK_HL=true
          HL_CLIENT_ID=ci
          API_BASE_URL=http://127.0.0.1:5001/demo-genesis/us-central1/api
          APP_URL=http://localhost:5173
          ENV
          printf 'ANTHROPIC_API_KEY=ci\nHL_CLIENT_SECRET=ci\nGEMINI_API_KEY=ci\n' > functions/.secret.local
      - run: npx --yes firebase-tools@15.34.2 emulators:exec --only auth,firestore,functions --project demo-genesis "node scripts/e2e-emulator.mjs"
